name: i_am_ok
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Pure Dart, with the IANA database compiled in — NOT a Flutter plugin, so it
  # needs no registrant and works in a bare background isolate. That is the
  # assumption ADR-0002 rests on; verified in Phase 1, see lib/domain/time/
  # time_zones.dart. Import only `timezone.dart` and `data/latest.dart`:
  # `standalone.dart` pulls dart:io and `browser.dart` pulls package:http.
  timezone: ^0.11.1
  sqflite: ^2.4.3
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  flutter_riverpod: ^3.4.2

  # The watcher's LOGIC-BEARING alarm (§10, §15). Unlike the watched side's
  # display-only `zonedSchedule`, this wakes a real Dart isolate so the warning
  # can verify before it speaks — a false "she didn't check in" is the worst bug
  # this app can have, so cancellation alone is not trusted.
  #
  # It brings a second background entry point with it. Anything that entry point
  # reaches must be bare-isolate safe: no Flutter, no Riverpod, no
  # flutter_timezone. `test/domain/domain_purity_test.dart` holds that list.
  android_alarm_manager_plus: ^4.0.7
  # Firebase (§15). Phase 4's backbone.
  #
  # These reach ALL THREE isolates, which is the thing to hold on to when
  # changing anything here: the alarm isolate reads Firestore as the signed-in
  # user (§10's verify-before-speaking), so it initialises Firebase itself and
  # shares no memory with the UI that did the same. `FirebaseBootstrap` is the
  # one implementation of that, called from each entry point.
  #
  # They also bring `INTERNET` into the merged manifest, through
  # `play-services-basement`. `docs/security/threat-model.md` leaned on its
  # absence until Phase 4 and no longer does — the claim was re-derived rather
  # than inherited, and `test/android_manifest_test.dart` says so.
  # **`firebase_core` is PINNED, not caret-ranged, and that is a build fix.**
  #
  # Adding `cloud_functions` in Phase 5 re-resolved the graph and pulled
  # `firebase_core` 4.13.0 -> 4.14.0. `firebase_auth` 6.5.7 compiles against
  # `FlutterFirebaseCorePlugin.customAuthDomain`, which 4.14.0 no longer has, so
  # `:firebase_auth:compileDebugJavaWithJavac` fails with *cannot find symbol* —
  # in a plugin's own Java, from a Dart package addition that touched neither.
  #
  # `flutter test` and `flutter analyze` both stayed green through it: nothing
  # about it is visible until the **Android** build runs, which is why the debug
  # APK is part of this project's definition of done rather than a formality.
  #
  # Pinned to the exact version Phase 4 built and verified against, so the
  # combination is the known-good one rather than whatever resolves next.
  #
  # 6.5.7 is the newest `firebase_auth` there is, so this is not a case of one
  # package lagging behind an upgrade that exists — `firebase_core` 4.14.0 was
  # released ahead of an auth that compiles against it. `cloud_functions` is held
  # at ^6.3.6 for the same reason: 6.4.0 requires core ^4.14.0 and would drag the
  # broken combination back in.
  #
  # Lift both together, with a `firebase_auth` that names 4.14.0, and only with
  # a real `flutter build apk --debug` behind it.
  firebase_core: 4.13.0
  firebase_auth: ^6.5.7

  # Identity (§1). Google Sign-In: free, one tap on Android, and the uid survives
  # a reinstall or a new phone, so links never break.
  #
  # **`serverClientId` must be the WEB OAuth client**, not the Android one —
  # using the Android client there produces a silent failure with no useful
  # error. The value is in `AuthRepository`, and it is not a secret: both client
  # ids ship inside the APK.
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0

  # Tier 2 (§3): a wake-up hint, and NOT load-bearing. If every push were
  # dropped the system stays correct and only gets slower — the watcher
  # reconciles on app open and again at alarm time. It earns its place for one
  # reason: it is the only way to refresh the local decision cache while the app
  # is not running, which is what protects an OFFLINE watcher from a false
  # warning.
  #
  # It brings the THIRD background entry point with it (§4), which is why
  # `lib/application/push_handler.dart` is written from the same template as the
  # alarm one and is held to the same bare-isolate rules by
  # `test/domain/domain_purity_test.dart`. Note in particular that no background
  # isolate may `close()` the store — on Android all three share one sqflite
  # connection.
  firebase_messaging: ^16.0.4

  # Phase 4 step 6 (§8, threat-model.md). **Monitoring mode only**, and the order
  # is the whole point: enforcing before clients are sending App Check tokens
  # locks the app out of its own backend. The client ships first, the console
  # watches the metrics, and enforcement is turned on in a later phase once real
  # traffic is attested.
  #
  # It is NOT a control yet, and the threat model says so in as many words —
  # until enforcement is enabled the rules are the whole defence. Nothing here
  # may be described as protecting anything.
  #
  # §15's package table was missing it until this step, which was a
  # documentation bug rather than a decision — PLAN.md step 6, the threat model
  # and `docs/infrastructure/deploy-notes.md` have all named it since Phase 0.
  # §15 now lists it.
  firebase_app_check: ^0.4.6

  # Callables (§9), added in Phase 5. `createInvite` and `redeemInvite` are the
  # only two, and both exist because the client cannot be trusted with the job:
  # §8 makes `invites/{code}` unreadable and unwritable by every client, so
  # minting a code and redeeming one both happen server-side or not at all.
  #
  # **UI isolate only.** No background entry point calls a function — a nudge
  # carries no authority (§3) and an isolate with seconds to live has nothing to
  # ask. `test/domain/domain_purity_test.dart` holds that line.
  #
  # The region has to be named at the call site: `instanceFor(region:
  # 'europe-west1')`. The library default is `us-central1`, and a callable
  # invoked there simply does not exist — a 404 that reads like a deploy that
  # never happened. See `InviteService`.
  cloud_functions: ^6.3.6

  # The Android share sheet, which is half of PLAN.md's locked pairing decision:
  # *"Invite codes + Android share sheet. No READ_CONTACTS, no address-book
  # upload, works on day one."* A code that cannot leave the phone only serves
  # the both-phones-on-one-table case.
  #
  # §15's package table did not list it — the same **documentation** gap
  # `firebase_app_check` had above, and resolved the same way rather than left
  # for a reader to find two documents disagreeing. §15 now lists it.
  #
  # UI isolate only, and it holds nothing: the sheet is handed a string and the
  # app does not learn, or care, where it went.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Domain tests use plain `test`, not `flutter_test` — docs/testing/strategy.md.
  # A domain test that imports flutter_test would pass while depending on a
  # binding the alarm isolate does not have. Still run with `flutter test`.
  test: ^1.31.1
  sqflite_common_ffi: ^2.4.2+1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
