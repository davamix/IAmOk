org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot close its own caches when building
# `flutter_timezone` with this Gradle/Kotlin combination. It fails with
# "Could not close incremental caches in .../compileDebugKotlin/... :
# class-fq-name-to-source.tab", and it is NOT a stale-cache problem — it
# reproduces from a deleted `build/` directory with every daemon stopped, so
# `flutter clean` does not help and neither does `gradlew --stop`.
#
# Turning incremental compilation off compiles those modules whole. The cost is
# build time on a project with one app module and a handful of small plugins,
# which is a rounding error; the benefit is a build that completes at all.
# Revisit when the Kotlin plugin is next upgraded.
kotlin.incremental=false
